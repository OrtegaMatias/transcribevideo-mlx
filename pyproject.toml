[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcribevideo-mlx"
version = "0.2.1"
description = "Turn a screen recording into a report: local vision + speech on Apple Silicon, cross-referencing what's on screen with what's being said."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matias Ortega Carrasco" }]
keywords = [
  "mlx", "vlm", "qwen", "whisper", "screencast", "video-analysis",
  "ocr", "apple-silicon", "local-llm", "tui", "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]
dependencies = [
  "mlx-vlm>=0.6.17",
  "mlx-whisper>=0.4",
  "jinja2>=3.1",
  "rich>=13.0",
  "pyfiglet>=1.0",
]

[project.urls]
Homepage = "https://github.com/OrtegaMatias/transcribevideo-mlx"
Repository = "https://github.com/OrtegaMatias/transcribevideo-mlx"
Issues = "https://github.com/OrtegaMatias/transcribevideo-mlx/issues"

[project.scripts]
transcribevideo = "transcribevideo_mlx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["transcribevideo_mlx"]
